name: Build AuraX OS v3.5-PRO Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AuraX Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Compiler
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Compile AuraX OS Firmware
        run: pio run -e aurax_s3

      - name: Upload Ready-to-Flash Binary
        uses: actions/upload-artifact@v4
        with:
          name: AuraX_OS_v3_5_PRO_Firmware
          path: |
            .pio/build/aurax_s3/firmware.bin
            .pio/build/aurax_s3/bootloader.bin
            .pio/build/aurax_s3/partitions.bin
